[package]
name = "bax-app"
description = "BAX 桌面应用：Tauri 外壳"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bax-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
bax-core.workspace = true
bax-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# 2.12 起要求 Rust 1.90；前端的 @tauri-apps/api 要停在同一个次版本 2.11
tauri = { version = "~2.11", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "~2.3"
tauri-plugin-single-instance = "~2.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging"] }

# 不继承 workspace 的 unsafe_code = "forbid"：Win32 补充需要 unsafe，只允许出现在 win32 模块里
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
