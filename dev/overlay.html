<!doctype html>
<html lang="zh-CN" class="overlay">
  <head>
    <meta charset="UTF-8" />
    <title>预览：悬浮窗</title>
    <style>
      /* 模拟游戏画面，方便看透明度 */
      html.overlay body {
        background: linear-gradient(135deg, #3d4a2f, #6b5d3f 45%, #2f3a44) !important;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { installMock } from "/src/dev/mock.ts";
      const params = new URLSearchParams(location.search);
      installMock({ locked: params.has("locked"), collapsed: params.has("collapsed") });
      await import("/src/overlay/main.ts");
    </script>
  </body>
</html>
