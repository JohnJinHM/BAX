[package]
name = "bax-engine"
description = "BAX 的后台运行时：对局会话、玩家资料获取与状态快照，不依赖 Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bax-batrace.workspace = true
bax-core.workspace = true
bax-gamelog.workspace = true
bax-store.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
unicode-normalization = "0.1"
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[features]
ts = ["dep:ts-rs", "bax-core/ts", "bax-batrace/ts", "bax-store/ts"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
wiremock.workspace = true

[lints]
workspace = true
