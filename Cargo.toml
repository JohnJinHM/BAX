[workspace]
resolver = "3"
members = ["crates/*", "tools/*", "src-tauri"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
bax-core = { path = "crates/bax-core" }
bax-gamelog = { path = "crates/bax-gamelog" }
bax-batrace = { path = "crates/bax-batrace" }
bax-store = { path = "crates/bax-store" }
bax-engine = { path = "crates/bax-engine" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
# Windows 上用系统自带的 SChannel，避免为 rustls/aws-lc 额外安装 CMake 与 NASM
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "gzip", "charset", "http2", "system-proxy"] }
# 0.41 起要求 Rust 1.89；本机工具链是 1.88，升级工具链后可以放开
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 由 Rust 类型生成前端用的 TypeScript 类型（ADR-0004、ADR-0006）
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
winreg = "0.56"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
